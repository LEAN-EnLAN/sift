[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "0.3.0"
description = "Sift: buscador inteligente de repositorios de GitHub a partir de necesidades técnicas"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Zafirus technical exercise"}]
license = {text = "MIT"}
dependencies = [
    "rich>=14,<15",
    "textual>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
